steps:
  # PASO 0: Construcción del sitio con Jekyll
  # Usamos Ruby para instalar las gemas y compilar el HTML/CSS
  - name: 'ruby:3.2'
    entrypoint: bash
    args:
      - -c
      - |
        gem install bundler
        bundle install
        bundle exec jekyll build

  # PASO 1: Despliegue a Firebase Hosting
  # Usamos Node.js para instalar las herramientas de Firebase y subir el sitio
  - name: 'node:20'
    entrypoint: bash
    args:
      - -c
      - |
        npm install -g firebase-tools
        firebase deploy --only hosting --project $PROJECT_ID --non-interactive

# Configuración de registros para evitar errores de permisos de buckets
options:
  logging: CLOUD_LOGGING_ONLY

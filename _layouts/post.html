<header class="post-header">
  <span class="post-category">{{ page.category | capitalize }}</span>
  <h1>{{ page.title }}</h1>
  
  <div class="post-tags" style="margin: 15px 0;">
    {% for tag in page.tags %}
      <a href="/temas#{{ tag | slugify }}" class="tag-link">#{{ tag }}</a>
    {% endfor %}
  </div>
  
  <div class="post-meta">{{ page.date | date: "%e de %B, %Y" }}</div>
</header>

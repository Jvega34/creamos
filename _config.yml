# =========================================
# CONFIGURACIÓN GENERAL - CREAMOS
# =========================================
title: Creamos
description: >-
  Análisis político para la soberanía y la libertad nacional. 
  Un espacio de investigación-acción y formación popular.
email: johan.rvega34@gmail.com
url: "https://creamoscolombia.org"
baseurl: ""
logo: "/assets/img/fondoClaro.png"

# Google Tag Manager Configuration
gtm_id: GTM-PLR2STVP

# 1. AJUSTES DE TIEMPO
# Crucial para que los posts del mismo día aparezcan de inmediato
timezone: America/Bogota
future: true

# 2. CONFIGURACIÓN DE URLS LIMPIAS
permalink: pretty

# 3. COLECCIONES (Aquí estaba el fallo)
# Esto le dice a Jekyll: "La carpeta _cacareos es especial, léela"
collections:
  cacareos:
    output: true
    permalink: /cacareos/:title/
  notas: # Colección para Notas, Crónicas y Opinión
    output: true
    permalink: /notas/:title/

# 4. VALORES POR DEFECTO
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "cacareos" # Asigna el layout automáticamente a los cacareos
    values:
      layout: "post"
  - scope:
      path: ""
      type: "notas"
    values:
      layout: "post"

# 5. PLUGINS
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# 6. EXCLUSIONES
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - cloudbuild.yaml
  - firebase.json
  - node_modules

title: Creamos
description: >-
  Difusión de ideas políticas y análisis técnico. 
  Transformando datos en visión país desde el rigor numérico.
email: johan.rvega34@gmail.com
url: "https://creamoscolombia.org"
baseurl: ""
logo: "/assets/img/fondoClaro.png"

# 1. AJUSTE DE TIEMPO (Crucial para que aparezcan los posts)
timezone: America/Bogota
future: true

# 2. CONFIGURACIÓN DE URLS LIMPIAS
permalink: pretty

# 3. COLECCIONES Y CATEGORÍAS
# Esto ayuda a Jekyll a organizar mejor los metadatos
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post" # Todos los archivos en _posts usarán este layout por defecto

# Menú de Navegación (URLs finales, no nombres de archivos)
header_pages:
  - /
  - /coyuntura/
  - /quienes-somos/

plugins:
  - jekyll-feed
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .github
  - cloudbuild.yaml
  - firebase.json
  - node_modules
